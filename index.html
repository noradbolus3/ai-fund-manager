<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Fund Manager V2</title><style>
body{margin:0;background:#080a10;color:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:21px;margin:0}.sub,.muted{font-size:11px;color:#8991aa}.live{color:#6ff0a8;border:1px solid #294b3a;border-radius:18px;padding:7px 11px;font-size:11px}.card{background:#10131d;border:1px solid #20263a;border-radius:17px;padding:15px;margin-bottom:14px}.head{display:flex;justify-content:space-between;margin-bottom:11px}.head b{font-size:13px}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.asset{background:#151927;border:1px solid #252c43;border-radius:13px;padding:12px}.coin{font-weight:700}.price{font-size:18px;font-weight:750;margin:10px 0 4px}.up{color:#6ff0a8}.down{color:#ff7185}.fresh{font-size:10px;color:#73efac}.tags,.checks{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:9px;background:#20263a;border-radius:6px;padding:4px 6px;color:#b3bad0}.ok{color:#73efac}.warn{color:#ffd166}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gate{font-size:19px;font-weight:800;color:#ff7185}.log{font:10px ui-monospace,monospace;color:#9299ae;line-height:1.8;max-height:150px;overflow:auto}@media(max-width:700px){.assets{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="app">
<div class="top"><div><h1>AI Fund Manager — V2</h1><div class="sub">LIVE MARKET DATA • RESEARCH / PAPER MODE</div></div><div class="live" id="live">● CONNECTING</div></div>
<div class="card"><div class="head"><b>MARKET UNIVERSE</b><span class="muted" id="updated">Waiting for stream…</span></div><div class="assets" id="assets"></div></div>
<div class="grid"><div class="card"><div class="head"><b>DATA VALIDATOR</b><span class="muted">Fail-closed</span></div><div id="validator"><span class="tag warn">Waiting for live feed…</span></div></div>
<div class="card"><div class="head"><b>FINAL GATE</b><span class="muted">No real orders</span></div><div class="gate">RESEARCH ONLY</div><div class="checks"><span class="tag ok">PAPER ONLY ✓</span><span class="tag">AI AGENTS NEXT</span></div></div></div>
<div class="card"><div class="head"><b>SYSTEM LOG</b><span class="muted">V2 iPad</span></div><div class="log" id="log"></div></div></div>
<script>
const coins=["btcusdt","ethusdt","solusdt","adausdt","xrpusdt","suiusdt"],names={btcusdt:"BTC",ethusdt:"ETH",solusdt:"SOL",adausdt:"ADA",xrpusdt:"XRP",suiusdt:"SUI"},state={};
function log(x){let e=document.getElementById("log");e.innerHTML=`[${new Date().toLocaleTimeString()}] ${x}<br>`+e.innerHTML}
function render(){let ks=coins.filter(x=>state[x]);document.getElementById("assets").innerHTML=ks.map(k=>{let x=state[k];return `<div class="asset"><span class="coin">${names[k]}</span><div class="price">$${x.price.toLocaleString(undefined,{maximumFractionDigits:x.price<1?5:2})}</div><div class="${x.change>=0?'up':'down'}">${x.change>=0?'+':''}${x.change.toFixed(2)}%</div><div class="tags"><span class="tag">Vol $${(x.volume/1e6).toFixed(1)}M</span><span class="tag fresh">LIVE ✓</span></div></div>`}).join("");document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString();document.getElementById("validator").innerHTML=`<div class="checks"><span class="tag ok">Symbols ${ks.length}/${coins.length} ✓</span><span class="tag ok">Price ✓</span><span class="tag ok">24h change ✓</span><span class="tag ok">Volume ✓</span><span class="tag">WebSocket ✓</span></div>`}
function connect(){const streams=coins.map(c=>c+"@ticker").join("/");const ws=new WebSocket("wss://stream.binance.com:9443/stream?streams="+streams);ws.onopen=()=>{document.getElementById("live").textContent="● LIVE DATA";log("WEBSOCKET → CONNECTED");};ws.onmessage=e=>{const m=JSON.parse(e.data).data;state[m.s.toLowerCase()]={price:+m.c,change:+m.P,volume:+m.q};render()};ws.onerror=()=>{document.getElementById("live").textContent="● FEED ERROR";log("WEBSOCKET → ERROR");};ws.onclose=()=>{document.getElementById("live").textContent="● RECONNECTING";log("WEBSOCKET → CLOSED / RETRY");setTimeout(connect,3000)}}connect();
</script></body></html>
